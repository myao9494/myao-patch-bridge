# ==============================================================================
# Myao Patch Bridge プロジェクト設定ファイル (pyproject.toml)
# パッケージ構成、依存関係、pytest設定などを管理します。
# ==============================================================================

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "myao-patch-bridge"
version = "0.1.0"
description = "Offline-first patch publisher and applier for independently initialized Git repositories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.116.1",
  "typing-extensions==4.16.0",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
]

[project.scripts]
patch-bridge = "rep_patch.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rep_patch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

